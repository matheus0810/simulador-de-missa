<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de Missa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* VOICE: reverente, mas com o charme de um cartucho antigo
   IDEA: um RPG de 8 bits — tela de jogo com caixa de diálogo azul, balões de fala
   PICTURE: presbitério em pixel art, padre com contorno de sprite, scanlines
   COLOUR and TYPE: noite azul-marinho, branco, vermelho e ouro; Press Start 2P + VT323
   LAYOUT: tela cheia; cena 16:9 em cima, diálogo embaixo, tudo na mesma moldura */
:root{color-scheme:dark;--bg:#000;--paper:#16165a;--ink:#f4f0e6;--soft:#a9a6c8;--red:#ff6060;--gold:#ffd84a;--green:#5ad46a;--line:#f4f0e6}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:22px/1.2 VT323,monospace;overflow:hidden}
body{display:grid;place-items:center;height:100dvh}
.game{position:relative;width:min(100vw,calc(100dvh * 16 / 9));aspect-ratio:16/9;overflow:hidden;container-type:inline-size;background:#000;box-shadow:inset 0 0 0 4px var(--line)}
.game::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(#0000 0 2px,#0003 2px 3px);z-index:4}
canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated}
.hud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:6px 8px;font:clamp(8px,1cqw,11px)/1 "Press Start 2P",monospace;background:#000a;z-index:2}
.bar{flex:1;height:8px;background:#333;border:2px solid var(--ink)}.bar i{display:block;height:100%;width:0;background:var(--gold)}
.hb{font:inherit;background:none;color:var(--ink);border:2px solid var(--ink);min-height:30px;min-width:30px;padding:0 6px;cursor:pointer}
.hb[aria-pressed=false]{color:var(--soft);border-color:var(--soft);text-decoration:line-through}.hb[hidden]{display:none}
#turn{position:absolute;right:10px;top:calc(clamp(8px,1cqw,11px) + 32px);font:clamp(9px,1.1cqw,12px)/1 "Press Start 2P",monospace;background:var(--gold);color:#000;border:3px solid #000;box-shadow:3px 3px 0 #000;min-height:44px;padding:0 12px;cursor:pointer;z-index:2}
#turn:disabled{opacity:.45;cursor:default}#turn[hidden]{display:none}
#turn:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.bub{position:absolute;z-index:1;max-width:min(52%,560px);background:#fff;color:#111;border:3px solid #000;box-shadow:4px 4px 0 #0008;padding:.35em .6em;font:clamp(14px,1.75cqw,23px)/1.15 VT323,monospace;transform:translate(-50%,-100%);pointer-events:none}
.bub::after{content:"";position:absolute;left:calc(50% - 8px);bottom:-14px;border:8px solid transparent;border-top:8px solid #000}
.bub i{color:#555}
#pb{transition:opacity .2s}
#vb{left:4%;bottom:20%;transform:none;background:#f3e7c8;max-width:min(44%,480px)}
#vb::after{left:24px}
#mb{background:#f3e7c8}#mb b{color:#7c0a14}
.dlg.mcbox{background:#4a1024eb}.dlg.mcbox .ph{color:#ffd84a}
#vb[style*="right: 4%"]::after{left:auto;right:24px}
.bub[hidden]{display:none}
.bub b{display:block;font:clamp(7px,.8cqw,10px)/1.6 "Press Start 2P",monospace;color:#b3121f}
.dlg{position:absolute;z-index:3;left:2%;right:2%;bottom:2.5%;max-height:30%;overflow:auto;background:#16165aeb;border:4px solid var(--line);box-shadow:0 0 0 3px #000,6px 6px 0 3px #0008;padding:8px 12px 10px;font-size:clamp(13px,1.3cqw,20px)}
#opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:6px}
#opts .opt{margin:0;border-color:#f4f0e655;align-items:flex-start}
.dlg.answered #opts .opt:not(.good){display:none}
.dlg.answered #opts{grid-template-columns:1fr}
.dlg.wide{max-height:88%;bottom:6%}
.dlg.slim{right:auto;max-width:60%}
.ph{color:var(--gold);font:clamp(8px,.8cqw,11px)/1.5 "Press Start 2P",monospace;margin:0 10px 0 0}
.rub{color:var(--red);margin:0 0 6px}
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:2px solid transparent;padding:4px 8px;margin:0 0 4px;cursor:pointer;min-height:44px;align-items:center}
.opt b{color:var(--gold);font:11px/1 "Press Start 2P",monospace;flex:none;width:2.2em}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--ink);outline:none}
.opt:hover:not(:disabled) b::before,.opt:focus-visible b::before{content:"▶"}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt.good{border-color:var(--green);color:var(--green)}
.opt.bad{opacity:.4;text-decoration:line-through}
.opt:disabled{cursor:default}
.shake{animation:sh .25s steps(2)}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#out p{margin:4px 0}.done{color:var(--green)}.warn{color:var(--red)}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:4px}.row .btn{margin:0}
.note{color:var(--soft);border-left:4px solid var(--gold);padding-left:10px}
.btn{font:12px/1 "Press Start 2P",monospace;background:var(--red);color:#fff;border:3px solid #000;box-shadow:4px 4px 0 #000;min-height:44px;padding:0 18px;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.5;cursor:wait}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:4px 18px}
.grp{margin:0 0 10px}.grp h3{font:10px/1.5 "Press Start 2P",monospace;color:var(--gold);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;color:var(--ink);background:none;border:2px solid var(--soft);min-height:44px;padding:2px 12px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--gold);color:#000;background:var(--gold)}
.fine{font-size:18px;color:var(--soft);margin:10px 0 0}
.big{font:clamp(14px,1.8vw,20px)/1.4 "Press Start 2P",monospace;color:var(--gold);margin:2px 0 8px;text-shadow:3px 3px 0 #7c0a14}
kbd{font:inherit;opacity:.7}
#talk{display:none;background:#0c0b18;border:4px solid var(--line);border-bottom:0;padding:6px 10px;font:17px/1.15 VT323,monospace;min-height:3.6em;max-height:26dvh;overflow:auto}
#talk p{margin:2px 0}
.game.home #talk{display:none}#talk b{font:9px/1 "Press Start 2P",monospace;color:var(--gold);margin-right:6px}#talk i{color:var(--soft)}
@media(max-width:760px),(max-aspect-ratio:1/1),(max-height:520px){
 body{display:block}
 .game{width:100vw;height:100dvh;aspect-ratio:auto;display:flex;flex-direction:column}
 canvas{flex:none;aspect-ratio:4/3}
 .bub{display:none!important}
 #talk{display:block}
 .dlg,.dlg.wide,.dlg.slim{position:static;flex:1;min-height:0;max-height:none;max-width:none;margin:0;font-size:18px;padding:8px 10px;box-shadow:none}
 #opts{grid-template-columns:1fr}
 .opt{min-height:42px;padding:4px 6px}
 .ph{font-size:9px}
 .setup{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
 .big{font-size:15px}
 .fine{font-size:16px}
}
@media(max-height:520px) and (min-aspect-ratio:1/1){
 .game{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 canvas{grid-row:1/3;height:100dvh;width:auto}
 #talk,.dlg,.dlg.wide,.dlg.slim{grid-column:2}
 #talk{max-height:34dvh}
 .hud{right:auto;width:calc(100dvh * 4 / 3)}
 #turn{top:auto;bottom:10px;left:10px;right:auto}
 .dlg,.dlg.wide,.dlg.slim{font-size:16px}
}
@media(prefers-reduced-motion:reduce){.shake,.blink{animation:none}}
</style>
</head>
<body>
<main class="game">
  <canvas id="cv" aria-label="Presbitério da igreja com o padre e os fiéis"></canvas>
  <div class="hud"><span id="pts">0 pontos</span><div class="bar"><i id="prog"></i></div><span id="cnt"></span><button class="hb" id="mus" aria-pressed="true" title="Música (M)">♪</button><button class="hb" id="fs" title="Tela cheia (F)">⛶</button></div>
  <div class="bub" id="pb" hidden></div>
  <div class="bub" id="vb" hidden></div>
  <div class="bub" id="mb" hidden></div>
  <button id="turn" hidden>Virar-se <kbd>V</kbd></button>
  <div id="talk" aria-live="polite"></div>
  <section class="dlg" id="panel" aria-live="polite"></section>
</main>

function tone(m,t,d,type='square',v=.08,dest){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);g.gain.setValueAtTime(v,t);g.gain.setValueAtTime(v,t+d*.75);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g).connect(dest||master);o.start(t);o.stop(t+d+.02);}

const PRE=[[60,64,67,72,76],[60,62,69,74,77],[59,62,67,74,77],[60,64,67,72,76],[60,64,69,76,81],[60,62,66,69,74],[59,62,67,74,79],[59,60,64,67,72],[57,60,64,67,72],[50,57,62,66,72],[55,59,62,67,71],[55,58,64,67,73],[53,57,62,69,74],[53,56,62,65,71],[52,55,60,67,72],[52,53,57,60,65],[50,53,57,60,65],[43,50,55,59,65],[48,52,55,60,64]];
const FIG=[0,1,2,3,4,2,3,4],S16=.2;
function pluck(m,t,v,d){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=hz(m);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g).connect(musG);o.start(t);o.stop(t+d+.02);}
function sched(){while(nextT<ac.currentTime+.2){const bar=PRE[(stepN>>4)%PRE.length],j=stepN%8;
 if(j===0)tone(bar[0],nextT,S16*7.8,'triangle',.13,musG);
 if(j===1)tone(bar[1],nextT,S16*6.8,'triangle',.07,musG);
 if(j>=2)pluck(bar[FIG[j]],nextT,.032,S16*3);
 nextT+=S16;stepN++;}}
function music(){if(!ac)return;const s=st.steps[st.i]||{},hush=!st.playing;
 const want=musicOn&&!hush?1:0;musG.gain.cancelScheduledValues(ac.currentTime);musG.gain.setTargetAtTime(want,ac.currentTime,.4);
 if(musicOn&&!timer){nextT=ac.currentTime+.05;timer=setInterval(sched,40);}
 if(!musicOn&&timer){clearInterval(timer);timer=null;}}
function sfx(kind){if(!audio())return;const t=ac.currentTime;
 if(kind==='ok')[76,79,83,88].forEach((m,j)=>tone(m,t+j*.06,.07,'square',.07));
 if(kind==='bad'){tone(52,t,.12,'square',.08);tone(47,t+.12,.2,'square',.08);}
